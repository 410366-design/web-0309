<html>
<head>
    <title>作品</title>
    <style>
        #board{
            width:1500px;
            height:850px;
            border:1px solid black;
            position:relative;
            overflow:hidden;
        }
        @keyframes walking{
            0%{background-position-x:0px;}
            100%{background-position-x:-144px;}
        }
        #role{
            width:48px;
            height:48px;
            background:url("pic/people.png");
            animation:walking 600ms steps(3) infinite paused;
            position:absolute;
        }
        .element{
            width:50px;
            height:50px;
            position:absolute;
        }
        #timer{
            position:absolute;
            left:1520px;
            top:20px;
            font-size:30px;
            font-weight:bold;
        }
    </style>
    <script>
        var gameing=false;
        var timeCount=0;
        var timerInterval;
        function getRand(min,max){
            return Math.floor(Math.random()*(max-min+1))+min;
        }
        function showPos(obj){
            obj.style.left = obj.pos.x + "px";
            obj.style.top = obj.pos.y + "px";
        }
        function mykeydown(event){
            event.preventDefault();
            if(!gameing){
                game_start();
            }
            var role = document.getElementById("role");
            if(event.key=="ArrowLeft"){
                role.style.backgroundPositionY="-48px";
            }
            else if(event.key=="ArrowRight"){
                role.style.backgroundPositionY="-96px";
            }
            role.way[event.key] = true;
            role.style.animationPlayState = "running";
        }
        function mykeyup(event){
            var role = document.getElementById("role");
            role.way[event.key] = false;
            role.style.animationPlayState = "paused";
        }
        function role_move(){
            var role = document.getElementById("role");
            if(role.way["ArrowLeft"]){
                if(role.pos.x > 0){
                    role.pos.x -= 5;
                }
            }
            else if(role.way["ArrowRight"]){
                if(role.pos.x < 1452){
                    role.pos.x += 5;
                }
            }
            showPos(role);
        }
        function element_move(e){
            if(!gameing) return;
            var role=document.getElementById("role");
            var distance = Math.sqrt(
                Math.pow(e.pos.x-role.pos.x,2)+
                Math.pow(e.pos.y-role.pos.y,2)
            );
            if(distance < 50){

                game_stop();
                alert("Game Over");
                return;
            }
            if(e.pos.y > 850){
                clearInterval(e.move);
                e.remove();
            }else{
                e.pos.x += getRand(-3,3);
                e.pos.y += 3;
                showPos(e);
            }
        }

        function element(){
            if(!gameing) return;
            var e = document.createElement("div");
            e.className = "element";
            e.style.backgroundColor=`rgb(${getRand(0,255)},${getRand(0,255)},${getRand(0,255)})`;
            e.pos = {
                x:getRand(0,1450),
                y:-50
            };
            showPos(e);
            e.move = setInterval(function(){
                element_move(e);
            },10);
            document.getElementById("board").appendChild(e);
        }
        function game_start(){
        if(gameing) return;
        gameing = true;
        timeCount = 0;
        document.getElementById("timer").innerHTML = "時間：0 秒";
        timerInterval = setInterval(function(){
        timeCount++;
        document.getElementById("timer").innerHTML =
        "時間：" + timeCount + " 秒";
        },1000);
         setInterval(element,100);
        }
        function game_stop(){
            gameing = false;
            clearInterval(timerInterval);
        }
        function init(){
            var role = document.getElementById("role");
            role.pos = {
                x:750,
                y:800
            };
            role.way = {
                "ArrowLeft":false,
                "ArrowRight":false
            };
            showPos(role);
            setInterval(role_move,20);
        }
    </script>
</head>
<body onload="init() "onkeydown="mykeydown(event) "onkeyup="mykeyup(event)">
    <div id="board">
        <div id="role"></div>
    </div>
    <div id="timer">時間：0 秒</div>
</body>
</html>
